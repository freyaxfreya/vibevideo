  // ================= helpers =================
  const texts = $("texts");
  function el(tag, cls, html, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.style.cssText = style; texts.appendChild(e); return e; }

  function big(zh, en, t, dwell, top, size, stag) {

      tl.to(b, { opacity: 0, duration: .4 }, t0 + d + 2.6);
    } });
  beat("E", "最暗的那天，光已来。", "On the darkest day, the light is already here.", { pre: .1, noChime: true });
  beat("E", null, null, { name: "易穷则变", pre: .4, dwell: 5.6,
    vis: (t0, d) => { quote("易穷则变，变则通，通则久", "At the end of a road, change; change, and it flows; flow, and it lasts.", t0, d, 400, 56, "《系辞下》", "Great Commentary, Part II"); } });

  // ================= 结尾：物不可穷 =================
  card("物不可穷", "Nothing ever reaches its end");
  beat("M", null, null, { name: "易经的最后一卦", pre: .5, bigText: "易经的最后一卦", bigEn: "The last hexagram of the I Ching", bigTop: 440, bigSize: 56, dwell: 3.2 });
  {
    const g = G(), h = mkHex(g, HEX.weiji, 960, 470, 340, 14, 50, INK, true);
    beat("N", "还没有过河。", "Not yet across the river.", { pre: .4, dwell: 3.0,
      vis: (t0, d) => {
        tl.set(g, { opacity: 1 }, t0 - .4); hexIn(h, t0 - .4, .3, .06);
        nameTag("未济卦", "Wei Ji · Before Completion", 960, 470 - 2.5 * 50 - 150, t0, t0 + d - .3);
        sfx("sweep", t0 - .4, { dur: 1 });
        tl.to(g, { opacity: 0, duration: .45 }, t0 + d - .3);
      } });
  }
  // 81：小狐汔济，濡其尾（河 + 一个光点游到岸边前停住）
  {
    const g = G();
    const waves = [610, 650, 690].map((y, k) => {
      let d = `M 240 ${y}`; for (let x = 240; x <= 1500; x += 30) d += ` L ${x} ${y + Math.sin(x / 60 + k) * 6}`;
      return S("path", { d, fill: "none", stroke: CYAN, "stroke-width": 1.6, opacity: .55 - k * .12, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, g);
    });
    const bank = S("path", { d: "M 1560 560 L 1540 600 L 1550 650 L 1530 720", fill: "none", stroke: "#c9b48a", "stroke-width": 2.5, filter: "url(#glow)", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 }, g);
    const bl = S("text", { x: 1610, y: 650, fill: "#8a8a8f", "font-size": 22, "font-family": "NSerif", "font-weight": 500, "letter-spacing": 4 }, g); bl.textContent = "岸";
    const dot = S("circle", { cx: 300, cy: 640, r: 8, fill: "#fff", filter: "url(#glow)", opacity: 0 }, g);
    beat("E", "小狐狸快游到岸了，尾巴湿了。", "The little fox has almost crossed — and its tail is wet.", { pre: .5, dwell: 5.4, noChime: true,
      vis: (t0, d) => {
        tl.set(g, { opacity: 1 }, t0 - .5);
        waves.forEach((w, k) => draw(w, t0 - .5 + k * .15, 1.0));
        draw(bank, t0, .8);
        quote("小狐汔济，濡其尾", "The little fox, nearly across, wets its tail.", t0, d, 230, 58, "未济卦 · 卦辞", "The Judgment of Wei Ji");
        tl.to(dot, { opacity: 1, duration: .4 }, t0 + .2);
        tl.to(dot, { attr: { cx: 1470 }, duration: 3.6, ease: "power3.out" }, t0 + .2);
        sfx("whoosh", t0 + .2, { dur: 3.2, pan0: -.6, pan1: .5 });
        tl.to(g, { opacity: 0, duration: .5 }, t0 + d - .3);
      } });
  }
  beat("E", "事物不会走到尽头，所以停在未济。", "Things never reach an end, so the book stops at Not Yet Across.", { pre: .4, dwell: 6.0, noChime: true,
    vis: (t0, d) => { quote("物不可穷也，故受之以未济，终焉", "Things cannot be exhausted; so comes Wei Ji, and there it ends.", t0, d, 380, 50, "《序卦》", "Sequence of the Hexagrams"); sfx("chime", t0, { dur: 3, f0: 523.25 }); } });
  beat("M", "哪一卦最好？", "Which hexagram is the best?", { pre: .5, dwell: 3.4,
    vis: (t0, d) => {
      tl.set(cells.flatMap(c => c.h.L.flatMap(o => o.els)), { attr: { fill: INK } }, t0 - .5);
      tl.set(cells.map(c => c.c), { opacity: .5 }, t0 - .5); tl.set(cells[0].h.g, { attr: { filter: "url(#glow)" } }, t0 - .5);
      tl.to(grid, { opacity: .5, duration: .6 }, t0 - .5);
    } });
  beat("E", "也许是你还没有走到的那一卦。", "Perhaps the one you haven't reached yet.", { pre: .2, dwell: 5.6,
    vis: (t0, d) => { tl.to(grid, { opacity: 0, duration: 1.6 }, t0 + 1.2); } });
  // 85：片尾卡，与片名卡呼应
  beat("N", null, null, { name: "片尾卡 易经", pre: .6, dwell: 6.0, fixed: true,
    vis: (t0, d) => {
      const e = el("div", "", `<span style="position:absolute;left:${850 - 95}px;top:${470 - 105}px">易</span><span style="position:absolute;left:${1070 - 95}px;top:${470 - 105}px">经</span>`, "position:absolute;inset:0;opacity:0;font-size:190px;line-height:1.1;color:#f5f2ec;text-shadow:0 0 24px rgba(255,255,255,.18);");
      tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 1.2 }, t0);
      tl.to("#tLine", { opacity: 1, duration: 1 }, t0 + .6);
      tl.to("#titleEn", { opacity: 1, duration: 1 }, t0 + 1.0);
      sfx("shimmer", t0, { dur: 2.4 });
      tl.to([e, "#tLine", "#titleEn"], { opacity: 0, duration: 1.2 }, t0 + d - .6);
    } });

  // ================= finish =================
  const TOTAL = Math.ceil((T + .6) * 10) / 10;
  tl.to(D, { t: TOTAL, duration: TOTAL, ease: "none" }, 0);
  for (const e of document.querySelectorAll("[data-duration]")) e.setAttribute("data-duration", TOTAL);
  window.__TOTAL = TOTAL;
  window.__timelines = window.__timelines || {};
  const _render = tl.render.bind(tl);
  const syncAll = () => { for (const f of SY) f(); drawDust(); };
  tl.render = function (...a) { const r = _render(...a); syncAll(); return r; };
  tl.eventCallback("onUpdate", syncAll);
  window.__timelines["main"] = tl;
  syncAll();
  tl.seek(0);
})();
</script>
